<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trekking Management Portal</title>
    <!-- Import Bootstrap styles for layout and UI components -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Configure ESM imports for Vue 3 and Vue Router 4 -->
    <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3.4.21/dist/vue.esm-browser.js",
        "vue-router": "https://unpkg.com/vue-router@4.3.0/dist/vue-router.esm-browser.js",
        "@vue/devtools-api": "https://unpkg.com/@vue/devtools-api@6.5.1/lib/esm/index.js"
      }
    }
    </script>
</head>
<body class="bg-light">
    
    <div id="app"></div>

    <!-- Load Bootstrap's JS bundle (includes Popper for tooltips/dropdowns) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Kick off our main Vue application -->
    <script type="module" src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
